
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CosmeticTo3D_Full_Project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CosmeticTo3DCreator app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CosmeticTo3DCreator-Windows
          path: CosmeticTo3D_Full_Project/dist/CosmeticTo3DCreator.exe
